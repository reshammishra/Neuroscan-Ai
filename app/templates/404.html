{% extends "base.html" %}

{% block title %}Page Not Found - NeuroScan AI{% endblock %}

{% block content %}
<div style="text-align: center; padding: 4rem 1rem;">
  <h1 style="font-size: 3rem; color: var(--primary); margin-bottom: 0.5rem;">404</h1>
  <h2 style="margin-bottom: 1rem;">Page or Scan Not Found</h2>
  <p style="color: var(--text-secondary); max-width: 480px; margin: 0 auto 1.5rem auto;">

  </p>
  <a href="{{ url_for('history.index') }}" class="btn btn-primary">Return to History</a>
</div>
{% endblock %}

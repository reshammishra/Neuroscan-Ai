{% extends "base.html" %}

{% block title %}File Too Large - NeuroScan AI{% endblock %}

{% block content %}
<div style="text-align: center; padding: 4rem 1rem;">
  <h1 style="font-size: 3rem; color: var(--danger); margin-bottom: 0.5rem;">413</h1>
  <h2 style="margin-bottom: 1rem;">Uploaded File Too Large</h2>
  <p style="color: var(--text-secondary); max-width: 480px; margin: 0 auto 1.5rem auto;">
    The medical file you attempted to upload exceeds the 10 MB maximum limit.
  </p>
  <a href="{{ url_for('detect.detect_view') }}" class="btn btn-primary">Try Again</a>
</div>
{% endblock %}
